# .testquality.yml - per-project configuration for the test quality gate.
#
# Generated from this project's own gate copy when the canonical core was
# adopted, so behaviour is preserved exactly. Edit freely; the sync script
# never overwrites this file.

backend_app_name: gym_app
py_test_file_glob: test_*.py
frontend_unit_dir: test
frontend_e2e_dir: e2e
max_test_lines: 50
min_test_lines: 3
max_assertions_per_test: 7
max_patches_per_test: 5
min_lines_for_docstring: 15
max_timeout_ms: 100

py_allowed_folders:
  - "commands"
  - "models"
  - "serializers"
  - "services"
  - "tasks"
  - "utils"
  - "views"

js_unit_suffixes:
  - ".test.js"
  - ".spec.js"
  - ".test.ts"
  - ".spec.ts"

js_e2e_suffixes:
  - ".spec.js"
  - ".spec.ts"

banned_tokens:
  - "batch"
  - "coverage"
  - "cov"
  - "deep"

# Performance budgets use the canonical standard and the registered host profile.
performance_paths: ["organizations=backend/gym_app/views/organization.py,backend/gym_app/serializers/organization.py", "corporate-requests=backend/gym_app/views/corporate_request.py,backend/gym_app/serializers/corporate_request.py", "recent-processes=backend/gym_app/views/process.py", "secop=backend/gym_app/views/secop.py,backend/gym_app/serializers/secop.py", "legal-requests=backend/gym_app/views/legal_request.py,backend/gym_app/serializers/legal_request.py", "organization-posts=backend/gym_app/views/organization_posts.py"]
performance_budget_tests: ["backend/gym_app/tests/views/test_organization_views.py", "backend/gym_app/tests/views/test_corporate_request_views.py", "backend/gym_app/tests/views/test_process.py", "backend/gym_app/tests/views/test_secop_views.py", "backend/gym_app/tests/views/test_legal_request_list_queries.py", "backend/gym_app/tests/views/test_legal_request_status_queries.py", "backend/gym_app/tests/views/test_organization_posts_queries.py"]

# Responsive ownership and acceptance sizes use the canonical standard.
responsive_module_paths: ["user-guide=frontend/src/views/user_guide"]
responsive_viewport_helper: frontend/e2e/helpers/viewports.js
